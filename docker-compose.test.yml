services:
  # Single all-in-one container: smbd, Samba tooling, the WebUI, and pytest
  # share one identity database and one filesystem view.
  samba-webui:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: test-samba-webui
    restart: unless-stopped
    command: ["python", "-m", "src.main"]
    ports:
      - "${WEBUI_PORT:-8080}:8080"
      - "1445:445"
      - "1139:139"
    environment:
      - PYTEST_ONLY=0
      - WEBUI_ADMIN_USER=${WEBUI_ADMIN_USER:-admin}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-adminpassword}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-dev-secret-key-for-testing-only}
      - WEBUI_AUTO_RELOAD=true
      - ALLOWED_STORAGE_ROOTS=/storage,/media
      - SAMBA_INCLUDE_CONF_PATH=/etc/samba/smb.webui.conf
      - SAMBA_BACKUP_DIR=/etc/samba/.backups
      - SAMBA_PID_FILE=/var/run/samba/smbd.pid
      - SAMBA_SMB_HOST=127.0.0.1
    volumes:
      - test_samba_etc:/etc
      - test_samba_conf:/etc/samba
      - test_samba_private:/var/lib/samba/private
      - test_samba_run:/var/run/samba
      - test_samba_storage:/storage
      - test_samba_media:/media
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

volumes:
  test_samba_etc:
  test_samba_conf:
  test_samba_private:
  test_samba_run:
  test_samba_storage:
  test_samba_media:
