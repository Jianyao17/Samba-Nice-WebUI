services:
  samba-webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samba-nice-webui
    restart: unless-stopped
    # 1. Share host PID namespace to send SIGHUP reload signal to host smbd
    pid: "host"
    # 2. Disable AppArmor for this container so it may signal the host smbd.
    #    Without it the reload fails with "Permission denied" on Ubuntu.
    security_opt:
      - label=disable
      - apparmor=unconfined
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - WEBUI_ADMIN_USER=${WEBUI_ADMIN_USER}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-this-secret-key-in-production}
      - ALLOWED_STORAGE_ROOTS=${ALLOWED_STORAGE_ROOTS}
      
      - SAMBA_INCLUDE_CONF_PATH=${SAMBA_INCLUDE_CONF_PATH}
      - SAMBA_BACKUP_DIR=/etc/samba/.backups
      - SAMBA_PID_FILE=/var/run/samba/smbd.pid
      - SAMBA_SMB_HOST=${SAMBA_SMB_HOST:-}

    volumes:
      # 3. Host Samba configurations and PID socket directory mounts
      - /etc/samba:/etc/samba
      - /var/run/samba:/var/run/samba
      # 4. Mount host storage root to /storage inside container
      - ${HOST_STORAGE_PATH:-/srv/samba}:/storage
      # 5. Host identity database. Required for the Users page to see and
      #    manage host Samba accounts; remove these lines to disable the
      #    feature. They grant the container write access to host credentials.
      - /var/lib/samba/private:/var/lib/samba/private
      - /etc/passwd:/etc/passwd
      - /etc/shadow:/etc/shadow
      - /etc/gshadow:/etc/gshadow
      - /etc/group:/etc/group
