name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests (test Samba nyata di-skip di luar Docker)
        run: uv run pytest -v

  samba-integration:
    name: Samba integration (real smbd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t samba-nice-test .

      - name: Run integration tests against real smbd
        run: docker run --rm samba-nice-test

  installer-checks:
    name: Installer & service unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/build-bundle.sh
          bash -n scripts/tests/test-bundle.sh

      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/setup.sh scripts/build-bundle.sh scripts/tests/test-bundle.sh

      - name: Verify systemd service unit
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo ubuntu:22.04 bash -c "apt-get update -qq && apt-get install -y -qq systemd >/dev/null && mkdir -p /opt/samba-nice-webui/venv/bin && touch /opt/samba-nice-webui/venv/bin/samba-nice-webui && chmod +x /opt/samba-nice-webui/venv/bin/samba-nice-webui && mkdir -p /etc/samba-nice-webui && touch /etc/samba-nice-webui/webui.env && systemd-analyze verify packaging/samba-nice-webui.service"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Run shell tests
        run: |
          uv sync --locked --extra dev
          uv run pytest tests/shell -v
