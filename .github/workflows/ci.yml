name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests (test Samba nyata di-skip di luar Docker)
        run: uv run pytest -v

  samba-integration:
    name: Samba integration (real smbd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t samba-nice-test .

      - name: Run integration tests against real smbd
        run: docker run --rm samba-nice-test

  installer-checks:
    name: Installer & service unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/build-bundle.sh
          bash -n scripts/tests/test-bundle.sh

      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/setup.sh scripts/build-bundle.sh scripts/tests/test-bundle.sh

      - name: Verify systemd service unit
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo ubuntu:22.04 bash -c "apt-get update -qq && apt-get install -y -qq systemd >/dev/null && mkdir -p /opt/samba-nice-webui/venv/bin && touch /opt/samba-nice-webui/venv/bin/samba-nice-webui && chmod +x /opt/samba-nice-webui/venv/bin/samba-nice-webui && mkdir -p /etc/samba-nice-webui && touch /etc/samba-nice-webui/webui.env && systemd-analyze verify packaging/samba-nice-webui.service"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Run shell tests
        run: |
          uv sync --locked --extra dev
          uv run pytest tests/shell -v

  publish:
    name: Build & push image
    # Publish only after all tests pass for a version tag push.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, samba-integration, installer-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR harus huruf kecil
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, samba-integration, installer-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          bash scripts/build-bundle.sh

      - name: Prepare release assets
        run: |
          cd dist
          sha256sum samba-nice-webui-*-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/samba-nice-webui-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  pages:
    name: Publish installer to GitHub Pages
    # Publish after the release exists so the installer never points at missing assets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage installer
        run: |
          mkdir -p _site
          cp scripts/setup.sh _site/setup.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
