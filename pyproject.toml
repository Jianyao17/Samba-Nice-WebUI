[project]
name = "samba-nice-webui"
version = "1.0.4"
description = "Modern and lightweight NiceGUI-based web management interface for Samba on Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
samba-nice-webui = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
